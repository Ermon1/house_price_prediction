version: '3.8'

services:
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.fastapi
    ports:
      - "8007:8000"
    restart: unless-stopped

  streamlit:
    build:
      context: ./streamlit_app
      dockerfile: Dockerfile.streamlit
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://fastapi:8000
    depends_on:
      - fastapi
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.5.0
    container_name: mlflow
    ports:
      - "5000:5000"
    environment:
      MLFLOW_HOST: 0.0.0.0
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri /mlflow/backend
      --default-artifact-root /mlflow/artifacts
    volumes:
      - mlflow_backend:/mlflow/backend
      - mlflow_artifacts:/mlflow/artifacts
    restart: unless-stopped

volumes:
  mlflow_backend:
  mlflow_artifacts: